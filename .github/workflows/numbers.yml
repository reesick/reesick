name: numbers

# redraws assets/numbers-*.svg from live contribution data, once a day
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 in pune
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/numbers.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - name: draw the numbers card
        run: python src/statscard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBERS_TOKEN: ${{ secrets.NUMBERS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: commit if anything moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/numbers-*.svg src/seed.json
          git diff --cached --quiet || git commit -m "numbers: daily redraw"
          git push
